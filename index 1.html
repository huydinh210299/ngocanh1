<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>For My Love</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: "Poppins", sans-serif;
        color: #fff;
        margin: 0;
        padding: 0;
        text-align: center;
        overflow-x: hidden;
      }

      h1 {
        font-family: "Great Vibes", cursive;
        font-size: 48px;
        margin-top: 30px;
        color: #fff;
        animation: fadeIn 2s ease;
      }

      .message {
        font-size: 18px;
        margin-top: -10px;
        margin-bottom: 30px;
        opacity: 0.9;
        animation: fadeIn 3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .swiper-cube {
        width: 300px;
        height: 300px;
        margin: 40px auto;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      }

      .swiper-coverflow {
        width: 100%;
        padding-top: 50px;
        padding-bottom: 50px;
      }

      /* 🔥 Make images fit perfectly */
      .swiper-slide {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* ensures full coverage */
        border-radius: 15px;
      }

      .label {
        margin-top: 20px;
        font-weight: 600;
        font-size: 20px;
        opacity: 0.95;
        animation: fadeIn 2s ease;
      }

      /* 🌨 Snow falling (replaces sakura) */
      .sakura {
        position: fixed;
        top: -10px;
        z-index: 9999;
        pointer-events: none;
        animation: fall linear infinite;
        opacity: 0.9;
      }

      @keyframes fall {
        0% {
          transform: translateY(-10px) rotate(0deg);
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <h1>For you</h1>

    <div class="label">Ngọc Anh</div>

    <!-- Cube Swiper -->
    <div class="swiper swiper-cube">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="1.jpg" />
        </div>
        <div class="swiper-slide">
          <img src="2.jpg" />
        </div>
        <div class="swiper-slide">
          <img src="3.jpg" />
        </div>
        <div class="swiper-slide">
          <img src="4.jpg" />
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>

    <div class="label">Bé Ngoan</div>

    <!-- Coverflow Swiper -->
    <div class="swiper swiper-coverflow">
      <div class="swiper-wrapper">
        <div class="swiper-slide" style="width: 300px; height: 300px">
          <img src="9.jpg" />
        </div>
        <div class="swiper-slide" style="width: 300px; height: 300px">
          <img src="10.jpg" />
        </div>
        <div class="swiper-slide" style="width: 300px; height: 300px">
          <img src="5.jpg" />
        </div>
        <div class="swiper-slide" style="width: 300px; height: 300px">
          <img src="6.jpg" />
        </div>
        <div class="swiper-slide" style="width: 300px; height: 300px">
          <img src="7.jpg" />
        </div>
        <div class="swiper-slide" style="width: 300px; height: 300px">
          <img src="8.jpg" />
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Snow Falling Script -->
    <script>
      function createSakura() {
        const sakura = document.createElement("img")
        sakura.src = "./ice.png" // your snowflake image
        sakura.classList.add("sakura")

        sakura.style.left = Math.random() * 100 + "vw"
        sakura.style.width = 20 + Math.random() * 20 + "px"
        sakura.style.animationDuration = 5 + Math.random() * 5 + "s"

        document.body.appendChild(sakura)

        setTimeout(() => sakura.remove(), 10000)
      }

      setInterval(createSakura, 300)
    </script>

    <!-- Init Swiper -->
    <script>
      new Swiper(".swiper-cube", {
        effect: "cube",
        grabCursor: true,
        cubeEffect: {
          shadow: true,
          slideShadows: true,
          shadowOffset: 20,
          shadowScale: 0.94,
        },
        pagination: {
          el: ".swiper-cube .swiper-pagination",
        },
      })

      new Swiper(".swiper-coverflow", {
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: {
          rotate: 50,
          stretch: 0,
          depth: 100,
          modifier: 1,
          slideShadows: true,
        },
        pagination: {
          el: ".swiper-coverflow .swiper-pagination",
        },
      })
    </script>
  </body>
</html>
